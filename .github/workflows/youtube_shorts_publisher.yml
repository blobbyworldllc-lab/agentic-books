name: YouTube Shorts Cloud Publisher

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'Countdown Day number (1-25)'
        required: true
        default: '1'
        type: string
      privacy:
        description: 'Video privacy status'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - public
          - private

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube Token from Secret
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          echo "$YOUTUBE_TOKEN_JSON" > config/token.json

      - name: Publish YouTube Short
        env:
          YOUTUBE_TOKEN_PATH: config/token.json
        run: |
          python Book_1/pips-christmas-countdown/scripts/video/publish_youtube_short.py --day ${{ inputs.day }} --privacy ${{ inputs.privacy }}
